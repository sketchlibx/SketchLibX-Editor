jdk:
  - openjdk17

install:
  - |
    set -e
    echo "Checking JitPack Gradle toolchain..."
    gradle --version
    ACTUAL_GRADLE=$(gradle --version | awk '/^Gradle / {print $2; exit}')
    if [ "$ACTUAL_GRADLE" != "8.9" ]; then
      echo "SketchLibX Editor requires Gradle 8.9 with AGP 8.7.3; JitPack reported $ACTUAL_GRADLE"
      exit 1
    fi
    gradle clean :editor:build :sample:assembleDebug :editor:publishReleasePublicationToMavenLocal --stacktrace
