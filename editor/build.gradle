plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def configuredGroup = System.getenv('GROUP') ?: 'com.sketchlibx.editor'
def libraryVersion = findProperty('SKETCHLIBX_VERSION') ?: '0.0.4'

group = configuredGroup
version = libraryVersion

android {
    namespace 'com.sketchlibx.editor'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName libraryVersion
        buildConfigField 'String', 'VERSION_NAME', '"' + libraryVersion + '"'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api platform('io.github.rosemoe:editor-bom:0.24.6')
    api 'io.github.rosemoe:editor'
    implementation 'io.github.rosemoe:language-textmate'

    // 1.7.1 keeps API 21 compatibility for consumers.
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.fragment:fragment:1.9.1'
}

// Android Gradle Plugin creates SoftwareComponent instances during afterEvaluate.
// Configure the Maven publication only after that lifecycle point.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = 'sketchlibx-editor'
                version = project.version.toString()
                pom {
                    name = 'SketchLibX Editor'
                    description = 'Reusable advanced Android code/text editor component based on Sora Editor.'
                    url = 'https://github.com/SketchLibX/SketchLibX-Editor'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                }
            }
        }
    }
}
